apiVersion: v1
kind: ConfigMap
metadata:
  name: ${CONFIG_NAME}
  namespace: ${NAMESPACE}
data:
  ASPNETCORE_ENVIRONMENT: Production
  PGGSSENCMODE: ${GSS_MODE}
  Database__MigrateOnStartup: "true"
  RabbitMq__Host: rabbitmq
  RabbitMq__Port: "5672"
  RabbitMq__VirtualHost: /fcg
  Queues__Identity: fcg-notifications-identity
  Queues__Payments: fcg-notifications-payments
